<!DOCTYPE html>
<html>
<head>
  <title>Research Network</title>
  <style>
    body { margin: 0; background: #1a1a2e; }
    #container { width: 100vw; height: 100vh; }
    #status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
              color: white; font-family: Arial, sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <div id="status">Loading graph...</div>
  <div id="container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/graphology-gexf/dist/graphology-gexf.browser.min.js"></script>

  <script>
    fetch("your-graph-file.gexf")
      .then(function(r) { return r.text(); })
      .then(function(gexf) {
        document.getElementById("status").style.display = "none";
        const graph = graphologyGEXF.parse(graphology.Graph, gexf);
        new Sigma(graph, document.getElementById("container"));
      })
      .catch(function(err) {
        document.getElementById("status").innerText = "Error: " + err.message;
        console.error(err);
      });
  </script>
</body>
</html>
